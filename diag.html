<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>连接诊断</title>
<style>
body{font-family:-apple-system,sans-serif;background:#fff7ef;margin:0;padding:16px;font-size:14px;line-height:1.6}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
h3{margin:0 0 8px;font-size:15px}
.ok{color:#2e7d32}.bad{color:#c62828}.mid{color:#a35c00}
code,pre{background:#f5f5f5;padding:2px 6px;border-radius:6px;font-size:12px;word-break:break-all;white-space:pre-wrap}
button{background:#ff7043;color:#fff;border:0;border-radius:12px;padding:10px 22px;font-size:15px;width:100%}
</style>
</head>
<body>
<h2 style="text-align:center">🔌 连接诊断</h2>
<div id="out"></div>
<button onclick="run()">重新测试</button>
<script>
const API = "https://kitchen-menu.agmbvnrbkt.cn-hangzhou.fcapp.run";
function card(title, cls, body){
  return `<div class="card"><h3>${title}</h3><div class="${cls}">${body}</div></div>`;
}
async function test(url, opts){
  const t0 = Date.now();
  try{
    const r = await fetch(url, opts);
    const ms = Date.now()-t0;
    let body = "";
    try{ body = (await r.text()).slice(0,120); }catch(e){ body = "(无法读取内容)"; }
    const cors = r.headers.get("access-control-allow-origin");
    return card(`✅ 已连通（${ms}ms）· 状态 ${r.status}`, r.ok?"ok":"mid",
      `返回内容: <code>${body||"(空)"}</code><br>跨域头: <code>${cors||"❌ 无 access-control-allow-origin"}</code>`);
  }catch(e){
    const ms = Date.now()-t0;
    return card(`❌ 连接失败（${ms}ms）`, "bad",
      `错误: <code>${e.message||e}</code><br>常见原因：接口未部署跨域版本、或服务没启动。`);
  }
}
async function run(){
  const out = document.getElementById("out");
  out.innerHTML = card("① 当前页面地址","ok",`<code>${location.href}</code>`);
  out.innerHTML += card("② 测试中…","mid","正在连接阿里云接口…");
  const r1 = await test(API+"/api/meta");
  const r2 = await test(API+"/api/state");
  out.innerHTML = out.innerHTML.split('<div class="card"><h3>② 测试中…')[0] + r1 + r2;
}
run();
</script>
</body>
</html>
